name: Release

on:
  push:
    branches: [main]
    paths: ['.github/release-request.json']
    tags:
      - 'v*'

# Never cancel an in-flight release build (artifact integrity); one run per tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: '1'

permissions:
  contents: read
  actions: read

jobs:
  # Inline CI gate (ci-pass semantics for a tag) plus creation of the draft release the package jobs
  # upload into. Kept on one job so the draft exists before any matrix job starts uploading.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Prepare requested tag after exact main CI succeeds
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/prepare-release.mjs
      - name: Verify tag, app version, main ancestry, and CI on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: node tools/release-check.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:dependencies
      - name: Full local CI gate (typecheck + lint + test + build + package-guard + dash guard)
        run: pnpm ci:local
      - name: Verify format transition and built executables
        run: |
          pnpm check:format-semver -- --base HEAD^
          pnpm conformance:particles
          pnpm phase3:acceptance
          node tools/smoke-video-worker.mjs
          node tools/smoke-media-worker.mjs
          node tools/smoke-spine-worker.mjs
          node tools/smoke-import-workers.mjs
          node tools/smoke-mcp-cli.mjs
      - name: Ensure a draft release exists for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --draft \
              --title "${RELEASE_TAG}" \
              --notes-file "docs/releases/${RELEASE_TAG#v}.md"
          fi

  native:
    needs: gate
    uses: ./.github/workflows/conformance-native.yml

  package:
    needs: [gate, native]
    permissions:
      contents: write
    strategy:
      # Never cancel the other OS builds if one fails; a maintainer can re-run a single leg.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ needs.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # rpmbuild is not present on ubuntu-latest by default and electron-builder needs it for the .rpm
      # target (AppImage and .deb build without it). Installed only on Linux.
      - name: Install rpm tooling (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      # Candidate releases are deliberately unsigned and never receive certificate secrets.
      - name: Build unsigned candidate installers
        if: contains(needs.gate.outputs.tag, '-')
        run: pnpm --filter editor package:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build signed stable installers
        if: ${{ !contains(needs.gate.outputs.tag, '-') }}
        run: |
          pnpm --filter editor exec electron-vite build
          pnpm --filter editor exec electron-builder --publish never --config.forceCodeSigning=true
        env:
          # Present only when the secrets are configured; empty otherwise (signing skipped, above).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # electron-builder auto-notarizes the mac build when all three are set; absent means no notarize.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Upload the installer artifacts to the tag's draft release. The glob per OS covers exactly the
      # electron-builder outputs (installers plus their update-metadata sidecars); unpacked dirs are left
      # behind. --clobber lets a re-run of one OS leg replace its own artifacts.
      - name: Upload installers to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd apps/editor/dist
          shopt -s nullglob
          files=()
          for pattern in \
            '*.dmg' '*.dmg.blockmap' \
            '*.zip' '*.zip.blockmap' \
            '*.exe' '*.exe.blockmap' \
            '*.AppImage' '*.deb' '*.rpm' \
            'latest*.yml'; do
            for f in $pattern; do files+=("$f"); done
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer artifacts found in apps/editor/dist" >&2
            exit 1
          fi
          printf 'Uploading:\n'; printf '  %s\n' "${files[@]}"
          gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber

  publish:
    needs: [gate, native, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.gate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Verify installer set and create checksums
        run: |
          gh release download "$RELEASE_TAG" --dir release-assets
          node tools/release-assets.mjs release-assets
          gh release upload "$RELEASE_TAG" release-assets/SHA256SUMS --clobber
      - name: Publish the verified release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
