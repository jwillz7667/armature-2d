name: CI

on:
  pull_request:
  push:
    branches: [main]

# PR runs cancel superseded runs; main runs never cancel (cache + release integrity).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Prettier formatting check (code and config; markdown is excluded)
        run: pnpm format:check
      - name: Em-dash / en-dash guard (INV-6)
        run: pnpm check:dashes

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify MCP output contracts and generated catalog
        run: pnpm --filter @marionette/mcp-server reference:check
      - name: Verify built worker startup and media exports
        run: |
          node tools/smoke-video-worker.mjs
          node tools/smoke-media-worker.mjs
          node tools/smoke-spine-worker.mjs
          node tools/smoke-import-workers.mjs
          node tools/smoke-mcp-cli.mjs
          node tools/package-ai-plugin.mjs
          node tools/smoke-ai-plugin.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: armature-mcp
          path: |
            dist/armature-mcp-*.tar.gz
            dist/armature-mcp-*.sha256
          if-no-files-found: error

  mcp-portable:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@marionette/mcp-server...
      - run: node tools/package-ai-plugin.mjs
      - run: node tools/smoke-ai-plugin.mjs

  format-semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:format-semver
      - run: pnpm check:format-version-stable

  package-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Phase-0 forbidden-package guard (LAW 5)
        run: pnpm check:packages

  phase3-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Phase 3 particle conformance (runtime-core matches committed fixtures, WP-3.10)
        run: pnpm conformance:particles
      - name: Phase 3 DoD acceptance (megaWin bundle plays; caps + determinism, WP-3.11)
        run: pnpm phase3:acceptance

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint PR commits (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          COMMIT_BASE: ${{ github.event.pull_request.base.sha }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$COMMIT_BASE" --to "$COMMIT_HEAD"

  # Every required job must finish successfully, including commit lint. Missing/skipped jobs fail.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:dependencies

  fixture-determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate all fixtures on the pinned toolchain and reject drift
        run: |
          pnpm --filter @marionette/conformance generate
          pnpm --filter @marionette/conformance generate:effects
          pnpm --filter @marionette/conformance generate:slot
          pnpm --filter @marionette/conformance generate:anim-state
          git diff --exit-code -- packages/conformance/src

  mcp-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify hosted MCP container
        shell: bash
        run: |
          set -euo pipefail
          docker build -f deploy/mcp/Dockerfile -t armature-mcp:test .
          docker volume create armature-mcp-test
          trap 'docker rm -f armature-mcp-test >/dev/null 2>&1 || true; docker volume rm armature-mcp-test >/dev/null 2>&1 || true' EXIT
          docker run -d --name armature-mcp-test -v armature-mcp-test:/data \
            -e ARMATURE_PUBLIC_URL=https://armature.example.test/mcp \
            -e ARMATURE_OAUTH_ISSUER=https://identity.example.test/ \
            -e ARMATURE_OAUTH_JWKS_URL=https://identity.example.test/jwks armature-mcp:test
          docker exec armature-mcp-test node --input-type=module -e '
            import assert from "node:assert/strict";
            import { writeFile } from "node:fs/promises";
            assert.equal(process.getuid(), 1000);
            for (let i = 0; ; i++) {
              try { assert.equal((await fetch("http://127.0.0.1:8080/healthz")).status, 200); break; }
              catch (error) { if (i >= 50) throw error; await new Promise(r => setTimeout(r, 100)); }
            }
            await writeFile("/data/restart-check", "persisted");'
          docker restart armature-mcp-test
          docker exec armature-mcp-test node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFile } from "node:fs/promises";
            assert.equal(await readFile("/data/restart-check", "utf8"), "persisted");
            for (let i = 0; ; i++) {
              try { assert.equal((await fetch("http://127.0.0.1:8080/healthz")).status, 200); break; }
              catch (error) { if (i >= 50) throw error; await new Promise(r => setTimeout(r, 100)); }
            }'

      - name: Verify root-owned Railway mount and privilege drop
        shell: bash
        run: |
          set -euo pipefail
          if docker run --rm --user 0 armature-mcp:test; then
            echo 'Root startup without explicit volume initialization unexpectedly succeeded'
            exit 1
          fi
          mount_dir="$RUNNER_TEMP/armature-root-volume"
          mkdir "$mount_dir"
          sudo chown 0:0 "$mount_dir"
          sudo chmod 700 "$mount_dir"
          trap 'docker rm -f armature-root-test >/dev/null 2>&1 || true; sudo rm -rf "$mount_dir"' EXIT
          docker run -d --name armature-root-test --user 0 -v "$mount_dir:/data" \
            -e ARMATURE_INIT_VOLUME=1 \
            -e ARMATURE_PUBLIC_URL=https://armature.example.test/mcp \
            -e ARMATURE_OAUTH_ISSUER=https://identity.example.test/ \
            -e ARMATURE_OAUTH_JWKS_URL=https://identity.example.test/jwks armature-mcp:test
          docker exec --user 1000:1000 armature-root-test node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFile, stat, writeFile } from "node:fs/promises";
            for (let i = 0; ; i++) {
              try { assert.equal((await fetch("http://127.0.0.1:8080/healthz")).status, 200); break; }
              catch (error) { if (i >= 50) throw error; await new Promise(r => setTimeout(r, 100)); }
            }
            const status = await readFile("/proc/1/status", "utf8");
            assert.match(status, /^Uid:\s+1000\s+1000\s+1000\s+1000$/m);
            assert.match(status, /^Gid:\s+1000\s+1000\s+1000\s+1000$/m);
            assert.match(status, /^Groups:[\t ]*$/m);
            const mount = await stat("/data");
            assert.equal(mount.uid, 1000);
            assert.equal(mount.mode & 0o777, 0o700);
            await writeFile("/data/restart-check", "non-root persisted");'
          docker restart armature-root-test
          docker exec --user 1000:1000 armature-root-test node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFile } from "node:fs/promises";
            for (let i = 0; ; i++) {
              try { assert.equal((await fetch("http://127.0.0.1:8080/healthz")).status, 200); break; }
              catch (error) { if (i >= 50) throw error; await new Promise(r => setTimeout(r, 100)); }
            }
            assert.equal(await readFile("/data/restart-check", "utf8"), "non-root persisted");
            assert.match(await readFile("/proc/1/status", "utf8"), /^Uid:\s+1000\s+1000\s+1000\s+1000$/m);'

  ci-pass:
    runs-on: ubuntu-latest
    if: always()
    needs:
      [
        typecheck,
        lint,
        test,
        build,
        mcp-portable,
        mcp-container,
        format-semver,
        package-guard,
        phase3-acceptance,
        commitlint,
        dependency-audit,
        fixture-determinism,
      ]
    steps:
      - name: Verify every required job succeeded
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.JOB_RESULTS); const names=["typecheck","lint","test","build","mcp-portable","mcp-container","format-semver","package-guard","phase3-acceptance","commitlint","dependency-audit","fixture-determinism"]; for(const name of names) { if(jobs[name]?.result !== "success") throw new Error(name + " did not succeed"); }'
