name: CI

on:
  pull_request:
  push:
    branches: [main]

# PR runs cancel superseded runs; main runs never cancel (cache + release integrity).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Prettier formatting check (code and config; markdown is excluded)
        run: pnpm format:check
      - name: Em-dash / en-dash guard (INV-6)
        run: pnpm check:dashes

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify built worker startup and media exports
        run: |
          node tools/smoke-video-worker.mjs
          node tools/smoke-media-worker.mjs
          node tools/smoke-spine-worker.mjs
          node tools/smoke-import-workers.mjs
          node tools/smoke-mcp-cli.mjs

  format-semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:format-semver
      - run: pnpm check:format-version-stable

  package-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Phase-0 forbidden-package guard (LAW 5)
        run: pnpm check:packages

  phase3-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Phase 3 particle conformance (runtime-core matches committed fixtures, WP-3.10)
        run: pnpm conformance:particles
      - name: Phase 3 DoD acceptance (megaWin bundle plays; caps + determinism, WP-3.11)
        run: pnpm phase3:acceptance

  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint PR commits (Conventional Commits)
        if: github.event_name == 'pull_request'
        env:
          COMMIT_BASE: ${{ github.event.pull_request.base.sha }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$COMMIT_BASE" --to "$COMMIT_HEAD"

  # Every required job must finish successfully, including commit lint. Missing/skipped jobs fail.
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:dependencies

  fixture-determinism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate all fixtures on the pinned toolchain and reject drift
        run: |
          pnpm --filter @marionette/conformance generate
          pnpm --filter @marionette/conformance generate:effects
          pnpm --filter @marionette/conformance generate:slot
          pnpm --filter @marionette/conformance generate:anim-state
          git diff --exit-code -- packages/conformance/src

  ci-pass:
    runs-on: ubuntu-latest
    if: always()
    needs:
      [
        typecheck,
        lint,
        test,
        build,
        format-semver,
        package-guard,
        phase3-acceptance,
        commitlint,
        dependency-audit,
        fixture-determinism,
      ]
    steps:
      - name: Verify every required job succeeded
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.JOB_RESULTS); const names=["typecheck","lint","test","build","format-semver","package-guard","phase3-acceptance","commitlint","dependency-audit","fixture-determinism"]; for(const name of names) { if(jobs[name]?.result !== "success") throw new Error(name + " did not succeed"); }'
