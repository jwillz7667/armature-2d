packages:
  - 'packages/*'
  - 'apps/*'
  - 'tools/*'
# Only the Electron binary installer and esbuild native-binary setup may run lifecycle scripts.
allowBuilds:
  electron: true
  esbuild: true
  # Squirrel installer tooling is unused; Windows builds use NSIS.
  electron-winstaller: false
minimumReleaseAgeExclude:
  - electron@44.3.0

# Narrow, same-major security floors for transitive packages with vulnerable upstream pins.
overrides:
  'handlebars@<4.7.9': 4.7.9
  'brace-expansion@>=1 <2': 1.1.18
  'brace-expansion@>=2 <3': 2.1.4
  'brace-expansion@>=5 <6': 5.0.9
  'js-yaml@>=4 <4.3.2': 4.3.2
  'fast-uri@>=3 <3.1.6': 3.1.6
  'postcss@>=8 <8.5.23': 8.5.23
  'ip-address@>=10 <10.3.1': 10.3.1
  'hono@>=4 <4.13.5': 4.13.5
  'nanoid@>=3 <3.3.18': 3.3.18
  '@hono/node-server@>=1 <1.19.15': 1.19.15
  'browserslist@>=4 <4.28.7': 4.28.7
  'qs@>=6 <6.16.0': 6.16.0
  '@xmldom/xmldom@>=0.8 <0.9': 0.8.15
  '@xmldom/xmldom@>=0.9 <0.10': 0.9.12
  'baseline-browser-mapping@>=2 <2.11.0': 2.11.0
